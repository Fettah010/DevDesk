name: Release

# Builds, packs and uploads a Velopack release to GitHub Releases.
#
#   Trigger A - tag push (recommended):
#     git tag v0.1.0-beta && git push origin v0.1.0-beta
#
#   Trigger B - manual run from the Actions tab: enter the same tag
#     (e.g. v0.1.0-beta) so the channel is derived the same way.
#
# The tag is the input; the version and channel are derived from it by
# Scripts/build-and-release.ps1 (roadmap O2):
#   v1.2.3        -> version 1.2.3, channel stable
#   v1.2.3-beta   -> version 1.2.3, channel beta
#   v1.2.3-dev    -> version 1.2.3, channel dev
# A tag whose version disagrees with DevDesk.csproj is refused: bump the version
# (Scripts/bump-version.ps1) and commit it before tagging.
#
# The script publishes a *published* release (not a draft) and never passes
# --pre: a prerelease-marked GitHub release is invisible to
# GithubSource(prerelease:false), which is how DevDesk updates itself.
#
# No PAT is needed: the built-in GITHUB_TOKEN with `contents: write` is enough.
# vpk is a pinned LOCAL tool (.config/dotnet-tools.json) - nothing is installed
# globally.
#
# A tag can only publish when the gate is green: `release` needs `verify`, which
# runs the same build and test commands as ci.yml. Velopack allows exactly one
# release per version per channel, so the tag is also checked against the feed
# first - a re-run of an already published version fails loudly instead of
# half-overwriting a release that installed clients may already be updating from.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0-beta (channel comes from the suffix)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Same commands as .github/workflows/ci.yml, with no path filter: a release
  # must never be publishable from a red tree.
  verify:
    name: Build & test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        shell: pwsh
        run: dotnet build DevDesk.csproj -c Release -p:Platform=x64

      - name: Test
        shell: pwsh
        run: dotnet test DevDesk.Tests -c Release -p:Platform=x64

  release:
    name: Build & publish
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore pinned tools
        run: dotnet tool restore

      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "push") { "${{ github.ref_name }}" } else { "${{ inputs.tag }}" }
          $tag = $tag.Trim()
          if ([string]::IsNullOrWhiteSpace($tag)) { throw "Could not determine the release tag." }
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-(beta|dev))?$') {
            throw "Tag '$tag' must look like vX.Y.Z, vX.Y.Z-beta or vX.Y.Z-dev."
          }
          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT

      # Velopack keeps one release per version per channel, and a client that
      # already updated to vX must not see the same vX republished as a different
      # build. A re-run of an existing tag therefore fails here, with the reason,
      # instead of half-overwriting the feed.
      - name: Refuse to republish an existing release
        id: duplicate
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $uri = "https://api.github.com/repos/$env:REPO/releases/tags/$env:TAG"
          $body = Join-Path $env:RUNNER_TEMP "release-$env:TAG.json"

          # curl.exe rather than Invoke-WebRequest: -SkipHttpErrorCheck is
          # PowerShell 7 only, and a 404 is an expected answer here, not an error.
          $headers = @(
            "-H", "Accept: application/vnd.github+json",
            "-H", "X-GitHub-Api-Version: 2022-11-28"
          )
          if (-not [string]::IsNullOrWhiteSpace($env:GITHUB_TOKEN)) {
            $headers += @("-H", "Authorization: Bearer $env:GITHUB_TOKEN")
          }

          $status = & curl.exe -sS -o $body -w "%{http_code}" @headers $uri
          Write-Output "GET $uri -> HTTP $status"

          if ($status -eq "200") {
            $release = Get-Content -LiteralPath $body -Raw | ConvertFrom-Json
            $detail = if ($release.draft) { " (it is still a DRAFT - publish or delete it, then re-run)" } else { "" }
            throw "Release $env:TAG already exists$detail. Bump the version with Scripts/bump-version.ps1 and tag again; a published version cannot be replaced."
          }

          if ($status -ne "404") {
            $text = if (Test-Path $body) { Get-Content -LiteralPath $body -Raw } else { "" }
            throw "Could not read the release feed for $env:TAG (HTTP $status): $text"
          }

          Write-Output "No existing release for $env:TAG - safe to publish."

      - name: Generate release notes
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          $notes = @(
            "## DevDesk $env:TAG",
            "",
            "Automated release built from commit ``$env:SHA``.",
            "",
            "For a full list of changes, see the [commits](https://github.com/$env:REPO/commits/$env:TAG)."
          )
          Set-Content -Path ReleaseNotes.md -Value $notes

      - name: Build, pack & upload
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          ./Scripts/build-and-release.ps1 `
            -Tag $env:TAG `
            -Runtime win-x64 `
            -ReleaseNotes ReleaseNotes.md `
            -Download `
            -Publish
          if ($LASTEXITCODE -ne 0) { throw "Release script failed with exit code $LASTEXITCODE" }
