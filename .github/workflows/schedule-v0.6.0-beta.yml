name: Schedule v0.6.0 beta release

# GitHub cron has no year field, so this annual cron is restricted to the
# requested one-time UTC date below. The release commit is pinned explicitly.
on:
  schedule:
    - cron: "13 13 2 11 *"

permissions:
  actions: write
  contents: write

jobs:
  schedule-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the tag and dispatch the gated release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: fe56f67b4f70ee5ff33d85211fa118c677ec5ae3
        shell: bash
        run: |
          set -euo pipefail

          target='2026-11-02T13:13:00Z'
          now="$(date -u +%s)"
          target_epoch="$(date -u -d "$target" +%s)"
          if (( now < target_epoch )) || [[ "$(date -u +%F)" != '2026-11-02' ]]; then
            echo "Outside the one-time release window ($target); no action taken."
            exit 0
          fi

          tag='v0.6.0-beta'
          check_absent() {
            local endpoint="$1"
            local description="$2"
            local body="$RUNNER_TEMP/github-check.json"
            local status
            status="$(curl --silent --show-error --connect-timeout 15 --max-time 30 \
              --output "$body" --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/$endpoint")"
            case "$status" in
              404) ;;
              200) echo "$description already exists; refusing to replace it." >&2; exit 1 ;;
              *) echo "Could not verify $description (GitHub HTTP $status); refusing to schedule." >&2; exit 1 ;;
            esac
          }

          check_absent "repos/$GH_REPO/releases/tags/$tag" "Release $tag"
          check_absent "repos/$GH_REPO/git/ref/tags/$tag" "Tag $tag"

          gh api --method POST "repos/$GH_REPO/git/refs" \
            --field "ref=refs/tags/$tag" \
            --field "sha=$TARGET_SHA"
          gh workflow run release.yml --repo "$GH_REPO" \
            --ref "$tag" --field "tag=$tag"
